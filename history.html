<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riwayat Transaksi - Modern</title>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F4F5F9;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    .bg-card-gradient {
      background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
    }

    .hide-scroll {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .hide-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-gray-200">

  <div class="w-full max-w-md bg-[#F4F5F9] min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
    
    <div class="bg-card-gradient rounded-b-[2.5rem] pt-10 pb-16 px-6 text-white shadow-lg z-10 relative">
      <div class="flex items-center justify-between mb-4">
        <a href="index.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm hover:bg-white/30 transition">
          <i class="fas fa-chevron-left"></i>
        </a>
        <h1 class="text-lg font-semibold tracking-wide">Riwayat & Analitik</h1>
        <button id="exportPDF" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm hover:bg-white/30 transition" title="Export PDF">
          <i class="fas fa-file-pdf"></i>
        </button>
      </div>
    </div>

    <div class="flex-1 px-6 -mt-10 relative z-20 overflow-y-auto hide-scroll pb-10" id="exportContainer">
      
      <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-gray-100 flex gap-3">
        <div class="w-1/2">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Bulan</label>
          <select id="monthSelect" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-3 py-2 text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="all">Semua Bulan</option>
            <option value="01">Januari</option>
            <option value="02">Februari</option>
            <option value="03">Maret</option>
            <option value="04">April</option>
            <option value="05">Mei</option>
            <option value="06">Juni</option>
            <option value="07">Juli</option>
            <option value="08">Agustus</option>
            <option value="09">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div class="w-1/2">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Tahun</label>
          <select id="yearSelect" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-3 py-2 text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50">
          <div class="w-8 h-8 rounded-full bg-green-100 text-green-600 flex items-center justify-center mb-2">
            <i class="fas fa-arrow-down text-sm"></i>
          </div>
          <p class="text-xs text-gray-400 font-medium">Pemasukan</p>
          <p class="text-sm font-bold text-gray-800 mt-0.5" id="totalIncome">Rp0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50">
          <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-2">
            <i class="fas fa-arrow-up text-sm"></i>
          </div>
          <p class="text-xs text-gray-400 font-medium">Pengeluaran</p>
          <p class="text-sm font-bold text-gray-800 mt-0.5" id="totalExpense">Rp0</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-50 col-span-2 flex justify-between items-center">
          <div>
            <p class="text-xs text-gray-400 font-medium">Saldo Aktif (Pribadi)</p>
            <p class="text-lg font-bold text-indigo-600 mt-0.5" id="totalBalance">Rp0</p>
          </div>
          <div class="text-right border-l border-gray-100 pl-4">
            <p class="text-xs text-gray-400 font-medium">Total Titipan</p>
            <p class="text-sm font-bold text-purple-600 mt-0.5" id="totalTitipan">Rp0</p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-gray-50">
        <h2 class="text-sm font-bold text-gray-800 mb-4">Statistik Keuangan</h2>
        <canvas id="transactionChart" class="w-full" height="200"></canvas>
      </div>

      <div>
        <h2 class="text-sm font-bold text-gray-800 mb-3">Detail Transaksi</h2>
        <div id="transactionList" class="space-y-3">
          </div>
      </div>

    </div>
  </div>

  <script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    // Format Rupiah & Tanggal
    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

    // Dinamis Tahun
    function populateYearSelect() {
      const yearSelect = $("#yearSelect");
      yearSelect.empty();
      yearSelect.append(`<option value="all">Semua Tahun</option>`);
      
      const years = new Set();
      transactions.forEach(t => {
        if (t.date) years.add(t.date.split("-")[0]);
      });
      years.add(new Date().getFullYear().toString()); 

      Array.from(years).sort().reverse().forEach(y => {
        yearSelect.append(`<option value="${y}">${y}</option>`);
      });
      yearSelect.val("all");
    }

    // Filter Data
    function filterTransactions(month, year) {
      return transactions.filter(t => {
        if (!t.date) return false;
        const [y, m] = t.date.split("-");
        if (month !== "all" && m !== month) return false;
        if (year !== "all" && y !== year) return false;
        return true;
      }).sort((a, b) => new Date(b.date) - new Date(a.date)); // Sortir terbaru
    }

    // Update Angka
    function updateTotals(filtered) {
      let income = 0, expense = 0, titipan = 0;
      
      filtered.forEach(t => {
        if (t.type === "income") income += t.amount;
        else if (t.type === "expense") expense += t.amount;
        else if (t.type === "titipan") titipan += t.amount;
      });

      const balance = income - expense;

      $("#totalIncome").text(formatRp(income));
      $("#totalExpense").text(formatRp(expense));
      $("#totalTitipan").text(formatRp(titipan));
      $("#totalBalance").text(formatRp(balance));

      return { income, expense, titipan };
    }

    // Render List UI Modern
    function renderList(filtered) {
      const list = $("#transactionList");
      list.empty();

      if (filtered.length === 0) {
        list.append(`
          <div class="text-center py-6">
            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-2">
              <i class="fas fa-receipt text-gray-300"></i>
            </div>
            <p class="text-xs text-gray-400">Tidak ada transaksi di periode ini</p>
          </div>
        `);
        return;
      }

      filtered.forEach((t) => {
        let iconHtml, amountColor, sign;
        
        if (t.type === 'income') {
          iconHtml = `<div class="w-10 h-10 rounded-xl bg-green-100 text-green-600 flex items-center justify-center"><i class="fas fa-arrow-down"></i></div>`;
          amountColor = 'text-green-600'; sign = '+';
        } else if (t.type === 'expense') {
          iconHtml = `<div class="w-10 h-10 rounded-xl bg-red-100 text-red-600 flex items-center justify-center"><i class="fas fa-shopping-bag"></i></div>`;
          amountColor = 'text-gray-800'; sign = '-';
        } else {
          iconHtml = `<div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fas fa-piggy-bank"></i></div>`;
          amountColor = 'text-purple-600'; sign = '+';
        }

        const itemHTML = `
          <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-gray-50">
            <div class="flex items-center gap-3">
              ${iconHtml}
              <div>
                <h4 class="text-sm font-bold text-gray-800 capitalize">${t.description}</h4>
                <p class="text-[10px] text-gray-400 mt-0.5">${formatDate(t.date)}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold ${amountColor}">${sign}${formatRp(t.amount).replace('Rp', '')}</p>
              <p class="text-[9px] text-gray-400 uppercase tracking-wider mt-0.5">${t.type}</p>
            </div>
          </div>
        `;
        list.append(itemHTML);
      });
    }

    // Render Chart.js
    let chartInstance = null;
    function updateChart(income, expense, titipan) {
      const ctx = document.getElementById('transactionChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut', // Doughnut chart lebih estetik untuk UI modern
        data: {
          labels: ['Pemasukan', 'Pengeluaran', 'Titipan'],
          datasets: [{
            data: [income, expense, titipan],
            backgroundColor: ['#10B981', '#EF4444', '#8B5CF6'],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          cutout: '70%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                usePointStyle: true,
                padding: 20,
                font: { family: 'Poppins', size: 11 }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ' ' + formatRp(context.raw);
                }
              }
            }
          }
        }
      });
    }

    // Main Refresh Data
    function refreshData() {
      const month = $("#monthSelect").val();
      const year = $("#yearSelect").val();
      const filtered = filterTransactions(month, year);
      
      const totals = updateTotals(filtered);
      renderList(filtered);
      updateChart(totals.income, totals.expense, totals.titipan);
    }

    // Init Page
    $(document).ready(() => {
      populateYearSelect();
      
      // Default to current month/year for better UX
      const now = new Date();
      const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
      const currentYear = now.getFullYear().toString();
      
      $("#monthSelect").val(currentMonth);
      $("#yearSelect").val(currentYear);

      refreshData();

      // Events
      $("#monthSelect, #yearSelect").on("change", refreshData);

      // Export PDF Logic
      $("#exportPDF").click(() => {
        const btn = $("#exportPDF");
        btn.html('<i class="fas fa-spinner fa-spin"></i>'); // loading state
        
        // Hide scrollbar temporary for clean screenshot
        const container = document.getElementById("exportContainer");
        
        html2canvas(container, {
          scale: 2,
          backgroundColor: "#F4F5F9",
          windowWidth: 400 // force mobile width
        }).then(canvas => {
          const imgData = canvas.toDataURL("image/png");
          const pdf = new jspdf.jsPDF("p", "mm", "a4");
          
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
          
          pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);
          pdf.save(`Laporan_Keuangan_${$("#monthSelect").val()}_${$("#yearSelect").val()}.pdf`);
          
          btn.html('<i class="fas fa-file-pdf"></i>'); // revert icon
        });
      });
    });
  </script>
</body>
</html>
